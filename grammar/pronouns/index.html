<style>

    height: 100%;

    display: flex;
    flex-direction: column;
    min-height: 100%;

  .screen { display: none; flex: 1; flex-direction: column; padding: 1rem; max-width: 720px; margin: 0 auto; width: 100%; }

  header.app-header {
    text-align: center;
    padding: 0.5rem 0 0.25rem;
  }

    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 600;

    line-height: 1.15;
    margin: 0.5rem 0 0.25rem;
  }
  .subtitle {
    font-size: 1.15rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 1.5rem;
    box-shadow: var(--shadow);
    border: 3px solid #f0e0c8;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 1rem 1.25rem;
    font-size: 1.35rem;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
    font-family: inherit;
    margin: 0.5rem 0;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-accent {
    background: var(--accent);
    color: #fff;
  }
  .btn-choice {
    background: #fff8f0;
    color: var(--text);
    border: 3px solid #f0d9b5;
    text-align: left;
    padding-left: 1.25rem;
  }
  .btn-choice:hover:not(:disabled) { background: #fff0dc; border-color: var(--accent); }
  .btn-choice.correct {
    background: #d8f3ef;
    border-color: var(--success);
    color: #1a6b62;
  }
  .btn-choice.wrong {
    background: #fde8e4;
    border-color: var(--error);
    color: #9b3a28;
  }
  .btn-choice:disabled { opacity: 0.85; cursor: default; }

    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin: 1rem 0 1.5rem;

    padding: 0.55rem 0.9rem;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: 999px;
    border: 3px solid #e0d0b8;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

    background: var(--primary);
    color: #fff;
    border-color: var(--primary-dark);
  }

    margin-bottom: 1rem;

    justify-content: space-between;
    align-items: center;
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 0.4rem;

    height: 14px;
    background: var(--bar-bg);
    border-radius: 999px;
    overflow: hidden;
  }

    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--success));

    transition: width 0.35s ease;
    border-radius: 999px;

    display: inline-block;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    background: #e8f4fc;
    color: var(--primary-dark);
    margin-bottom: 0.75rem;

    font-weight: 600;
    margin-bottom: 1.25rem;

    color: var(--accent);
    font-weight: 800;
    margin: 0 0.15rem;

    padding: 0.9rem 1rem;
    border-radius: 14px;
    font-size: 1.15rem;
    font-weight: 600;
    display: none;

  .feedback.show { display: block; }
  .feedback.ok {
    background: #d8f3ef;
    color: #1a6b62;
    border: 2px solid var(--success);
  }
  .feedback.bad {
    background: #fde8e4;
    color: #9b3a28;
    border: 2px solid var(--error);
  }
  .end-score {
    font-size: clamp(2.5rem, 12vw, 4rem);
    font-weight: 800;
    color: var(--success);
    text-align: center;
    margin: 1rem 0;

    font-size: 1.35rem;
    text-align: center;
    margin-bottom: 1.5rem;
    font-weight: 600;

  .decor {
    font-size: 2.5rem;
    text-align: center;

// --- Game state ---
let selectedCat = 0;
let deck = [];
let qIndex = 0;
let score = 0;
let attempts = 0; // 0 = first try, 1 = second try already wrong once
let locked = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dealQuestions(cat) {
  let pool = cat === 0 ? BANK.slice() : BANK.filter(q => q.category === cat);
  if (pool.length === 0) pool = BANK.slice();

  if (cat === 0) {
    // Prefer balanced mix across categories
    const byCat = {1:[],2:[],3:[],4:[],5:[],6:[]};
    pool.forEach(q => byCat[q.category].push(q));
    Object.keys(byCat).forEach(k => { byCat[k] = shuffle(byCat[k]); });
    const picked = [];
    // Round-robin until 20
    let i = 0;
    while (picked.length < 20) {
      const cats = [1,2,3,4,5,6];
      for (const c of cats) {
        if (picked.length >= 20) break;
        if (byCat[c].length > i) picked.push(byCat[c][i]);
      }
      i++;
      if (i > 30) break; // safety
    }
    // Fill if short
    if (picked.length < 20) {
      const ids = new Set(picked.map(q => q.id));
      const rest = shuffle(pool.filter(q => !ids.has(q.id)));
      while (picked.length < 20 && rest.length) picked.push(rest.shift());
    }
    return shuffle(picked).slice(0, 20);
  }

  // Single category: shuffle and take up to 20 (repeat-fill if needed)
  let out = shuffle(pool);
  if (out.length >= 20) return out.slice(0, 20);
  while (out.length < 20) {
    out = out.concat(shuffle(pool));
  }
  return out.slice(0, 20);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  deck = dealQuestions(selectedCat);
  qIndex = 0;
  score = 0;
  attempts = 0;
  locked = false;
  showScreen('gameScreen');
  renderQuestion();
}

function renderQuestion() {
  const q = deck[qIndex];
  attempts = 0;
  locked = false;
  document.getElementById('progressText').textContent = (qIndex + 1) + ' / 20';
  document.getElementById('scoreText').textContent = 'Score: ' + score;
  document.getElementById('progressFill').style.width = ((qIndex) / 20 * 100) + '%';
  document.getElementById('catBadge').textContent = CAT_NAMES[q.category];
  document.getElementById('stem').innerHTML = q.stem.replace(/___/g, '<span class="blank">____</span>');
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';
  document.getElementById('continueBtn').style.display = 'none';

  const box = document.getElementById('choices');
  box.innerHTML = '';
  // Shuffle choice display order but track real answer
  const order = shuffle([0,1,2,3]);
  order.forEach((origIdx, displayPos) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-choice';
    btn.textContent = (displayPos + 1) + '.  ' + q.choices[origIdx];
    btn.dataset.orig = origIdx;
    btn.addEventListener('click', () => onChoose(btn, origIdx));
    box.appendChild(btn);
  });
}

function onChoose(btn, origIdx) {
  if (locked) return;
  const q = deck[qIndex];
  const correct = origIdx === q.answerIndex;
  const fb = document.getElementById('feedback');
  const buttons = document.querySelectorAll('#choices .btn-choice');

  if (correct) {
    locked = true;
    btn.classList.add('correct');
    buttons.forEach(b => b.disabled = true);
    if (attempts === 0) score++;
    fb.className = 'feedback show ok';
    const cheers = ['Great job! ⭐', 'Well done! 👏', 'Excellent! 🎉', 'Correct! 👍', 'Nice work! 🌟'];
    fb.textContent = cheers[Math.floor(Math.random() * cheers.length)];
    document.getElementById('scoreText').textContent = 'Score: ' + score;
    document.getElementById('continueBtn').style.display = 'block';
    document.getElementById('continueBtn').onclick = nextQuestion;
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    if (attempts === 0) {
      attempts = 1;
      fb.className = 'feedback show bad';
      fb.textContent = 'Not quite. Tip: ' + q.tip + ' Try once more!';
    } else {
      locked = true;
      buttons.forEach(b => {
        b.disabled = true;
        if (Number(b.dataset.orig) === q.answerIndex) b.classList.add('correct');
      });
      fb.className = 'feedback show bad';
      fb.textContent = 'The answer is “‘ + q.choices[q.answerIndex] + ’”. ' + q.tip;
      document.getElementById('continueBtn').style.display = 'block';
      document.getElementById('continueBtn').onclick = nextQuestion;
    }
  }
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= 20) {
    endGame();
  } else {
    renderQuestion();
  }
}

function endGame() {
  document.getElementById('progressFill').style.width = '100%';
  showScreen('endScreen');
  document.getElementById('endScore').textContent = score + ' / 20';
  let msg, decor;
  if (score >= 18) { msg = 'Outstanding! You are a pronoun star!'; decor = '🏆🌟🏆'; }
  else if (score >= 14) { msg = 'Great work! Keep practising!'; decor = '⭐👏⭐'; }
  else if (score >= 10) { msg = 'Good try! Review the tips and play again.'; decor = '💪📚💪'; }
  else { msg = 'Keep going! Practice makes perfect.'; decor = '✏️🌈✏️'; }
  document.getElementById('endMsg').textContent = msg;
  document.getElementById('endDecor').textContent = decor;
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedCat = Number(btn.dataset.cat);
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('playAgainBtn').addEventListener('click', startGame);
document.getElementById('homeBtn').addEventListener('click', () => showScreen('titleScreen'));
</script>
