],"source":"full-sent"},{"id":"ought-38","prompt":"Problem: Eric witnessed a crime. Choose the correct sentence.","answer":"He ought to call the police.","distractors":["He ought call the police.","He should to call the police.","He must to call the police."],"unit":"U2","skill":"ought-to","difficulty":"mid","choices":["He ought call the police.","He should to call the police.","He must to call the police.","He ought to call the police."],"source":"full-sent"},{"id":"ought-39","prompt":"Problem: Felix never labels his water bottle. → Complete with ought to + phrase.","answer":"ought to write his name on his bottle","distractors":["should to write his name on his bottle","ought write his name on his bottle","must to write his name on his bottle"],"unit":"U2","skill":"ought-to","difficulty":"easy","source":"parallel","problem":"Felix never labels his water bottle.","advice":"write his name on his bottle","choices":["must to write his name on his bottle","ought to write his name on his bottle","should to write his name on his bottle","ought write his name on his bottle"]},{"id":"ought-40","prompt":"Problem: Gina leaves art scraps on the floor. → Complete with ought to + phrase.","answer":"ought to tidy the art corner after craft","distractors":["should to tidy the art corner after craft","ought tidy the art corner after craft","must to tidy the art corner after craft"],"unit":"U2","skill":"ought-to","difficulty":"easy","source":"parallel","problem":"Gina leaves art scraps on the floor.","advice":"tidy the art corner after craft","choices":["should to tidy the art corner after craft","ought tidy the art corner after craft","must to tidy the art corner after craft","ought to tidy the art corner after craft"]},{"id":"ought-41","prompt":"Problem: Hank forgets to charge his tablet for class. → Complete with ought to + phrase.","answer":"ought to charge his tablet the night before","distractors":["should to charge his tablet the night before","ought charge his tablet the night before","must to charge his tablet the night before"],"unit":"U2","skill":"ought-to","difficulty":"easy","source":"parallel","problem":"Hank forgets to charge his tablet for class.","advice":"charge his tablet the night before","choices":["must to charge his tablet the night before","ought to charge his tablet the night before","should to charge his tablet the night before","ought charge his tablet the night before"]},{"id":"ought-42","prompt":"Problem: Ivy never returns library books on time. → Complete with ought to + phrase.","answer":"ought to note the return date in her diary","distractors":["should to note the return date in her diary","ought note the return date in her diary","must to note the return date in her diary"],"unit":"U2","skill":"ought-to","difficulty":"mid","source":"parallel","problem":"Ivy never returns library books on time.","advice":"note the return date in her diary","choices":["should to note the return date in her diary","ought note the return date in her diary","must to note the return date in her diary","ought to note the return date in her diary"]},{"id":"ought-43","prompt":"Problem: Joel talks while others present. → Complete with ought to + phrase.","answer":"ought to listen quietly during presentations","distractors":["should to listen quietly during presentations","ought listen quietly during presentations","must to listen quietly during presentations"],"unit":"U2","skill":"ought-to","difficulty":"easy","source":"parallel","problem":"Joel talks while others present.","advice":"listen quietly during presentations","choices":["should to listen quietly during presentations","ought listen quietly during presentations","must to listen quietly during presentations","ought to listen quietly during presentations"]},{"id":"ought-44","prompt":"Problem: Kate's pencil case is sticky and dirty. → Complete with ought to + phrase.","answer":"ought to wipe her pencil case every week","distractors":["should to wipe her pencil case every week","ought wipe her pencil case every week","must to wipe her pencil case every week"],"unit":"U2","skill":"ought-to","difficulty":"easy","source":"parallel","problem":"Kate's pencil case is sticky and dirty.","advice":"wipe her pencil case every week","choices":["should to wipe her pencil case every week","ought wipe her pencil case every week","must to wipe her pencil case every week","ought to wipe her pencil case every week"]},{"id":"ought-45","prompt":"Problem: Liam never practises his recorder. → Complete with ought to + phrase.","answer":"ought to practise for ten minutes daily","distractors":["should to practise for ten minutes daily","ought practise for ten minutes daily","must to practise for ten minutes daily"],"unit":"U2","skill":"ought-to","difficulty":"easy","source":"parallel","problem":"Liam never practises his recorder.","advice":"practise for ten minutes daily","choices":["must to practise for ten minutes daily","ought to practise for ten minutes daily","should to practise for ten minutes daily","ought practise for ten minutes daily"]},{"id":"ought-46","prompt":"Problem: Nina rushes and spills soup often. → Complete with ought to + phrase.","answer":"ought to carry trays with both hands","distractors":["should to carry trays with both hands","ought carry trays with both hands","must to carry trays with both hands"],"unit":"U2","skill":"ought-to","difficulty":"easy","source":"parallel","problem":"Nina rushes and spills soup often.","advice":"carry trays with both hands","choices":["should to carry trays with both hands","ought carry trays with both hands","must to carry trays with both hands","ought to carry trays with both hands"]}]}</script>
<script>

function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},1100)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var x=a[i];a[i]=a[j];a[j]=x}return a}
function pickN(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
function GameShell(o){
  var s=this;s.lives=o.lives||3;s.max=s.lives;s.streak=0;s.s1=0;s.s2=0;s.sec=o.timerSec||18;s.left=0;s.tid=null;s.run=false;s.qi=0;s.items=o.items||[];
  s.hud=function(){$('hud-timer').textContent='⏱ '+s.left+'s';$('hud-lives').textContent='♥ '+s.lives;$('hud-streak').textContent='🔥 '+s.streak;$('hud-p1').textContent='P1 '+s.s1;$('hud-p2').textContent='P2 '+s.s2;$('hud-q').textContent=(s.items.length?(s.qi+1):0)+'/'+s.items.length};
  s.startTimer=function(){clearInterval(s.tid);s.left=s.sec;s.hud();s.tid=setInterval(function(){s.left--;s.hud();if(s.left<=0){clearInterval(s.tid);if(s.onTimeout)s.onTimeout()}},1000)};
  s.stop=function(){clearInterval(s.tid)};
  s.ok=function(p){s.streak++;if(p===2)s.s2++;else s.s1++;s.hud();try{HcyFx.correct()}catch(e){}toast('Nice!');};
  s.bad=function(){s.streak=0;s.lives=Math.max(0,s.lives-1);s.hud();try{HcyFx.wrong()}catch(e){}toast(s.lives?'Oops':'Out of lives');};
  s.reset=function(){s.stop();s.lives=s.max;s.streak=0;s.s1=0;s.s2=0;s.qi=0;s.run=false;s.hud();try{HcyFx.reset()}catch(e){};$('start-overlay').style.display='flex'};
}
function bootFx(){try{HcyFx.init({mascotMount:$('hcy-mascot-slot'),mascotMode:'3d'})}catch(e){}
 document.body.addEventListener('pointerdown',function(){try{HcyFxAudio&&HcyFxAudio.unlock()}catch(e){}},{once:true});}

/* Aaron HARD RULE: no P6 GE 1st Term Exam 2026-2027 paper items */
function isExamPaperItem(it){
  if(!it || typeof it!=="object") return false;
  var s=String(it.source||""), u=String(it.unit||""), tag=String(it.tag||""), id=String(it.id||""), p=String(it.prompt||"");
  var origin=String(it.origin||""), section=String(it.section||"");
  var blob=(s+" "+u+" "+tag+" "+id+" "+p+" "+origin).toLowerCase();
  if(/^exam/i.test(s)) return true;
  if(/exam\s*[a-j]/i.test(blob)) return true;
  if(/\bexam[a-j]\b/i.test(blob)) return true;
  if(/u\d\s*\/\s*exam/i.test(u)) return true;
  if(/typhoon-parallel|examc-parallel|exam-parallel/i.test(tag+" "+origin)) return true;
  if(/\[exam\b/i.test(p) || /\[exam\b/i.test(id)) return true;
  if((section==="F"||section==="H") && (/exam/i.test(s+u) || /\[exam/i.test(p))) return true;
  return false;
}
function filterNoExamItems(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(function(it){ return !isExamPaperItem(it); });
}
function showExamQuarantine(msg){
  var banner=document.getElementById("exam-quarantine-banner");
  if(!banner){
    banner=document.createElement("div");
    banner.id="exam-quarantine-banner";
    banner.setAttribute("role","status");
    banner.style.cssText="position:sticky;top:0;z-index:9999;background:#7f1d1d;color:#fff;padding:12px 16px;font:600 15px/1.4 system-ui,sans-serif;text-align:center;border-bottom:3px solid #fbbf24;";
    document.body.insertBefore(banner, document.body.firstChild);
  }
  banner.textContent=msg;
  ["btn-start","btn-start2"].forEach(function(id){
    var b=document.getElementById(id);
    if(b){ b.disabled=true; b.style.opacity="0.45"; b.style.pointerEvents="none"; b.textContent="0 items — exam bank removed"; }
  });
  var n=document.querySelector("#start-overlay .start-card p");
  if(n) n.textContent=msg+" · 0 playable items.";
}

function parseBankPayload(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(data.items && Array.isArray(data.items)) return data.items;
  return [];
}
function loadFatBank(fileName, normalizeFn, onReady){
  function finish(raw){
    var payloadItems = filterNoExamItems(parseBankPayload(raw));
    var items = normalizeFn(payloadItems);
    if(!items.length){
      try{
        var emb = filterNoExamItems(parseBankPayload(JSON.parse($("bank-json").textContent)));
        items = normalizeFn(emb);
      }catch(e){ items=[]; }
    }
    onReady(shuffle(items));
  }
  var embedded = null;
  try{ embedded = JSON.parse($("bank-json").textContent); }catch(e){ embedded = {items:[]}; }
  var tryFetch = (location.protocol !== "file:");
  if(!tryFetch){ finish(embedded); return; }
  fetch("../../banks/"+fileName).then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
    .then(function(data){ finish(data); })
    .catch(function(){ finish(embedded); });
}



var BANK=[], G=null, cur=null, lock=false, holdP={}, holdA={};
function normalizeOught(raw){
  return raw.map(function(it){
    var problem=it.problem, advice=it.advice, ans=it.answer||'';
    var phrase=advice||'';
    if(phrase && /^ought to\s+/i.test(phrase)) phrase=phrase.replace(/^ought to\s+/i,'');
    if(!phrase && ans){
      var m=ans.match(/ought to\s+(.+?)\.?$/i); phrase=m?m[1]:'';
    }
    if(!problem){
      problem=(it.prompt||'').replace(/^Problem:\s*/i,'').replace(/\s*→.*$/,'').replace(/\s*Complete.*$/i,'').trim();
    }
    if(!problem) problem=ans;
    return {id:it.id, problem:problem, advice:phrase?'ought to '+phrase:ans, phrase:phrase, answer:ans};
  }).filter(function(x){return x.phrase && x.problem});
}
function paint(){cur=G.items[G.qi%G.items.length];lock=false;holdP={};holdA={};
 $('prompt').textContent='Match PROBLEM ↔ ADVICE (hold both)'; $('hint').textContent=cur.problem;
 var probs=shuffle([cur].concat(pickN(BANK.filter(function(x){return x.problem!==cur.problem}),3)));
 var advs=shuffle([cur].concat(pickN(BANK.filter(function(x){return x.phrase!==cur.phrase}),3)));
 function fill(id,list,kind){var g=$(id);g.innerHTML='';list.forEach(function(it){var b=document.createElement('button');b.type='button';b.className='choice';
  b.textContent=kind==='p'?it.problem:('ought to '+it.phrase);
  b.addEventListener('pointerdown',function(e){e.preventDefault();if(lock||!G.run)return;try{b.setPointerCapture(e.pointerId)}catch(err){}b.classList.add('held');
   var side=id==='grid1'?1:2; if(kind==='p')holdP[e.pointerId]={it:it,el:b,side:side}; else holdA[e.pointerId]={it:it,el:b,side:side}; tryLock();});
  b.addEventListener('pointerup',function(e){b.classList.remove('held');delete holdP[e.pointerId];delete holdA[e.pointerId]});g.appendChild(b)})}
 fill('grid1',probs,'p'); fill('grid2',advs,'a'); G.startTimer();
}
function tryLock(){var ps=Object.keys(holdP),as=Object.keys(holdA); if(!ps.length||!as.length)return;
 var P=holdP[ps[0]],A=holdA[as[0]]; if(lock)return; lock=true;G.stop();
 var ok=P.it.phrase===A.it.phrase && P.it.phrase===cur.phrase;
 if(ok){P.el.classList.add('ok');A.el.classList.add('ok');G.ok(P.side); try{HcyFx.stamp('Locked!')}catch(e){}}
 else{P.el.classList.add('bad');A.el.classList.add('bad');G.bad()} setTimeout(next,750)}
function next(){if(G.lives<=0)return;G.qi++;if(G.qi>=G.items.length)G.qi=0;paint()}
function start(){G.run=true;$('start-overlay').style.display='none';G.qi=0;G.lives=G.max;G.streak=0;G.s1=0;G.s2=0;G.items=shuffle(BANK);paint()}
function bootGame(items){
  BANK=items; G=new GameShell({items:BANK,timerSec:20});
  G.onTimeout=function(){G.bad();next()};
  $('btn-start').onclick=$('btn-start2').onclick=start;
  $('btn-reset').onclick=function(){G.reset()};
  $('btn-next').onclick=function(){if(G.run)next()};
  bootFx();G.hud();
  var n=$('start-overlay').querySelector('.start-card p');
  if(n) n.textContent='Ought-to problem↔advice · bank '+BANK.length+'.';
}
loadFatBank('ought-to.json', normalizeOught, bootGame);

</script>
