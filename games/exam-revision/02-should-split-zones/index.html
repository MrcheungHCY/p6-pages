ght go hiking during Signal 8.","Ian must to go hiking during Signal 8."],"unit":"U1","skill":"should","difficulty":"mid","choices":["Ian ought go hiking during Signal 8.","Ian shouldn't go hiking during Signal 8.","Ian should go hiking during Signal 8.","Ian must to go hiking during Signal 8."],"source":"parallel","modal":"shouldn't","phrase":"go hiking during Signal 8"},{"id":"should-39","prompt":"When you cough, you ____ cover your mouth.","answer":"should","distractors":["shouldn't","ought","must to"],"unit":"U1","skill":"should","difficulty":"easy","choices":["should","shouldn't","ought","must to"],"source":"gap","form":"gap"},{"id":"should-40","prompt":"You ____ eat too much fried food.","answer":"shouldn't","distractors":["should","ought","must to"],"unit":"U1","skill":"should","difficulty":"easy","choices":["should","shouldn't","ought","must to"],"source":"gap","form":"gap"},{"id":"should-41","prompt":"To stay healthy, we ____ drink plenty of water.","answer":"should","distractors":["shouldn't","ought","must to"],"unit":"U1","skill":"should","difficulty":"easy","choices":["should","shouldn't","ought","must to"],"source":"gap","form":"gap"},{"id":"should-42","prompt":"We ____ go to bed late every night.","answer":"shouldn't","distractors":["should","ought","must to"],"unit":"U1","skill":"should","difficulty":"easy","choices":["should","shouldn't","ought","must to"],"source":"gap","form":"gap"},{"id":"should-43","prompt":"Choose the best advice (good/safe): Mira / rinse her lunchbox every day.","answer":"Mira should rinse her lunchbox every day.","distractors":["Mira shouldn't rinse her lunchbox every day.","Mira ought rinse her lunchbox every day.","Mira must to rinse her lunchbox every day."],"unit":"U1","skill":"should","difficulty":"easy","source":"parallel","modal":"should","phrase":"rinse her lunchbox every day","choices":["Mira shouldn't rinse her lunchbox every day.","Mira ought rinse her lunchbox every day.","Mira must to rinse her lunchbox every day.","Mira should rinse her lunchbox every day."]},{"id":"should-44","prompt":"Choose the best advice (bad/unsafe): Noel / share earphones when he has a cold.","answer":"Noel shouldn't share earphones when he has a cold.","distractors":["Noel should share earphones when he has a cold.","Noel ought share earphones when he has a cold.","Noel must to share earphones when he has a cold."],"unit":"U1","skill":"should","difficulty":"easy","source":"parallel","modal":"shouldn't","phrase":"share earphones when he has a cold","choices":["Noel should share earphones when he has a cold.","Noel ought share earphones when he has a cold.","Noel must to share earphones when he has a cold.","Noel shouldn't share earphones when he has a cold."]},{"id":"should-45","prompt":"Choose the best advice (good/safe): Pia / stretch after sitting for homework.","answer":"Pia should stretch after sitting for homework.","distractors":["Pia shouldn't stretch after sitting for homework.","Pia ought stretch after sitting for homework.","Pia must to stretch after sitting for homework."],"unit":"U1","skill":"should","difficulty":"easy","source":"parallel","modal":"should","phrase":"stretch after sitting for homework","choices":["Pia must to stretch after sitting for homework.","Pia should stretch after sitting for homework.","Pia shouldn't stretch after sitting for homework.","Pia ought stretch after sitting for homework."]},{"id":"should-46","prompt":"Choose the best advice (bad/unsafe): Quinn / leave half-eaten fruit in the desk.","answer":"Quinn shouldn't leave half-eaten fruit in the desk.","distractors":["Quinn should leave half-eaten fruit in the desk.","Quinn ought leave half-eaten fruit in the desk.","Quinn must to leave half-eaten fruit in the desk."],"unit":"U1","skill":"should","difficulty":"easy","source":"parallel","modal":"shouldn't","phrase":"leave half-eaten fruit in the desk","choices":["Quinn must to leave half-eaten fruit in the desk.","Quinn shouldn't leave half-eaten fruit in the desk.","Quinn should leave half-eaten fruit in the desk.","Quinn ought leave half-eaten fruit in the desk."]},{"id":"should-47","prompt":"When you feel dizzy, you ____ sit down and rest.","answer":"should","distractors":["shouldn't","ought","must to"],"unit":"U1","skill":"should","difficulty":"easy","source":"parallel","form":"gap","choices":["must to","should","shouldn't","ought"]},{"id":"should-48","prompt":"You ____ copy a friend's medicine dosage.","answer":"shouldn't","distractors":["should","ought","must to"],"unit":"U1","skill":"should","difficulty":"easy","source":"parallel","form":"gap","choices":["must to","shouldn't","should","ought"]}]}</script>
<script>

function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},1100)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var x=a[i];a[i]=a[j];a[j]=x}return a}
function pickN(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
function GameShell(o){
  var s=this;s.lives=o.lives||3;s.max=s.lives;s.streak=0;s.s1=0;s.s2=0;s.sec=o.timerSec||18;s.left=0;s.tid=null;s.run=false;s.qi=0;s.items=o.items||[];
  s.hud=function(){$('hud-timer').textContent='⏱ '+s.left+'s';$('hud-lives').textContent='♥ '+s.lives;$('hud-streak').textContent='🔥 '+s.streak;$('hud-p1').textContent='P1 '+s.s1;$('hud-p2').textContent='P2 '+s.s2;$('hud-q').textContent=(s.items.length?(s.qi+1):0)+'/'+s.items.length};
  s.startTimer=function(){clearInterval(s.tid);s.left=s.sec;s.hud();s.tid=setInterval(function(){s.left--;s.hud();if(s.left<=0){clearInterval(s.tid);if(s.onTimeout)s.onTimeout()}},1000)};
  s.stop=function(){clearInterval(s.tid)};
  s.ok=function(p){s.streak++;if(p===2)s.s2++;else s.s1++;s.hud();try{HcyFx.correct()}catch(e){}toast('Nice!');};
  s.bad=function(){s.streak=0;s.lives=Math.max(0,s.lives-1);s.hud();try{HcyFx.wrong()}catch(e){}toast(s.lives?'Oops':'Out of lives');};
  s.reset=function(){s.stop();s.lives=s.max;s.streak=0;s.s1=0;s.s2=0;s.qi=0;s.run=false;s.hud();try{HcyFx.reset()}catch(e){};$('start-overlay').style.display='flex'};
}
function bootFx(){try{HcyFx.init({mascotMount:$('hcy-mascot-slot'),mascotMode:'3d'})}catch(e){}
 document.body.addEventListener('pointerdown',function(){try{HcyFxAudio&&HcyFxAudio.unlock()}catch(e){}},{once:true});}

/* Aaron HARD RULE: no P6 GE 1st Term Exam 2026-2027 paper items */
function isExamPaperItem(it){
  if(!it || typeof it!=="object") return false;
  var s=String(it.source||""), u=String(it.unit||""), tag=String(it.tag||""), id=String(it.id||""), p=String(it.prompt||"");
  var origin=String(it.origin||""), section=String(it.section||"");
  var blob=(s+" "+u+" "+tag+" "+id+" "+p+" "+origin).toLowerCase();
  if(/^exam/i.test(s)) return true;
  if(/exam\s*[a-j]/i.test(blob)) return true;
  if(/\bexam[a-j]\b/i.test(blob)) return true;
  if(/u\d\s*\/\s*exam/i.test(u)) return true;
  if(/typhoon-parallel|examc-parallel|exam-parallel/i.test(tag+" "+origin)) return true;
  if(/\[exam\b/i.test(p) || /\[exam\b/i.test(id)) return true;
  if((section==="F"||section==="H") && (/exam/i.test(s+u) || /\[exam/i.test(p))) return true;
  return false;
}
function filterNoExamItems(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(function(it){ return !isExamPaperItem(it); });
}
function showExamQuarantine(msg){
  var banner=document.getElementById("exam-quarantine-banner");
  if(!banner){
    banner=document.createElement("div");
    banner.id="exam-quarantine-banner";
    banner.setAttribute("role","status");
    banner.style.cssText="position:sticky;top:0;z-index:9999;background:#7f1d1d;color:#fff;padding:12px 16px;font:600 15px/1.4 system-ui,sans-serif;text-align:center;border-bottom:3px solid #fbbf24;";
    document.body.insertBefore(banner, document.body.firstChild);
  }
  banner.textContent=msg;
  ["btn-start","btn-start2"].forEach(function(id){
    var b=document.getElementById(id);
    if(b){ b.disabled=true; b.style.opacity="0.45"; b.style.pointerEvents="none"; b.textContent="0 items — exam bank removed"; }
  });
  var n=document.querySelector("#start-overlay .start-card p");
  if(n) n.textContent=msg+" · 0 playable items.";
}

function parseBankPayload(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(data.items && Array.isArray(data.items)) return data.items;
  return [];
}
function loadFatBank(fileName, normalizeFn, onReady){
  function finish(raw){
    var payloadItems = filterNoExamItems(parseBankPayload(raw));
    var items = normalizeFn(payloadItems);
    if(!items.length){
      try{
        var emb = filterNoExamItems(parseBankPayload(JSON.parse($("bank-json").textContent)));
        items = normalizeFn(emb);
      }catch(e){ items=[]; }
    }
    onReady(shuffle(items));
  }
  var embedded = null;
  try{ embedded = JSON.parse($("bank-json").textContent); }catch(e){ embedded = {items:[]}; }
  var tryFetch = (location.protocol !== "file:");
  if(!tryFetch){ finish(embedded); return; }
  fetch("../../banks/"+fileName).then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
    .then(function(data){ finish(data); })
    .catch(function(){ finish(embedded); });
}



var BANK=[], G=null, cur=null, lock=false, holding={};
function normalizeShould(raw){
  return raw.filter(function(it){
    var u=String(it.unit||''); var s=String(it.source||'');
    if(s==='ExamC' || u.indexOf('ExamC')>=0) return false;
    return true;
  }).map(function(it){
    var modal=it.modal, phrase=it.phrase, ans=it.answer||'';
    if(!modal || !phrase){
      var m=ans.match(/\b(shouldn'?t|should)\b/i);
      modal=m?m[1].toLowerCase().replace("’","'"):'should';
      if(modal==="shouldn't"||modal==="shouldnt") modal="shouldn't";
      phrase=ans.replace(/^.*?\bshouldn'?t\s+/i,'').replace(/^.*?\bshould\s+/i,'').replace(/\.$/,'').trim();
    }
    var who=(it.prompt||'').split('/')[0];
    who=who.replace(/^Choose[^:]*:\s*/i,'').trim();
    if(who.length>40){
      var wm=ans.match(/^(.+?)\s+should/i); who=wm?wm[1]:'Someone';
    }
    var mark=(modal==="shouldn't")?'bad':'good';
    return {id:it.id, who:who, modal:modal, phrase:phrase, mark:mark, answer:ans};
  }).filter(function(x){return x.phrase});
}
function paint(){cur=G.items[G.qi%G.items.length];lock=false;holding={};
 $('prompt').textContent=(cur.who?cur.who+': ':'')+cur.phrase;
 $('hint').textContent="Sort into SHOULD or SHOULDN'T — two can sort at once";
 var pool=$('pool'); if(pool) pool.innerHTML='';
 var distractors=pickN(BANK.filter(function(x){return x.phrase!==cur.phrase}),3).concat([cur]);
 shuffle(distractors).forEach(function(it){
  var c=document.createElement('button');c.type='button';c.className='chip';c.textContent=it.who+': '+it.phrase;c.dataset.modal=it.modal;c.dataset.phrase=it.phrase;
  c.addEventListener('pointerdown',function(e){e.preventDefault();if(lock||!G.run)return;try{c.setPointerCapture(e.pointerId)}catch(err){}c.classList.add('held');holding[e.pointerId]={el:c,modal:it.modal,phrase:it.phrase,player:e.clientX<window.innerWidth/2?1:2};});
  c.addEventListener('pointerup',function(e){c.classList.remove('held');delete holding[e.pointerId]});
  if(pool) pool.appendChild(c);
 });
 ['zone-should','zone-shouldnt'].forEach(function(zid){
  var z=$(zid); if(!z) return;
  z.onpointerdown=function(e){e.preventDefault(); if(lock||!G.run)return;
   var ids=Object.keys(holding); if(!ids.length){z.classList.add('held'); setTimeout(function(){z.classList.remove('held')},150); return}
   var h=holding[ids[ids.length-1]];
   var want=(zid==="zone-should")?"should":"shouldn't";
   var ok=(h.modal===want);
   if(h.phrase===cur.phrase){lock=true;G.stop(); if(ok){h.el.classList.add('ok');G.ok(h.player); z.appendChild(h.el)} else {h.el.classList.add('bad');G.bad()} setTimeout(next,700)}
   else {
     if(ok){h.el.classList.add('ok');G.ok(h.player); try{HcyFx.stamp('Sort!')}catch(e){} z.appendChild(h.el)}
     else {h.el.classList.add('bad');G.bad()}
   }
  };
 });
 G.startTimer();
}
function next(){if(G.lives<=0)return;G.qi++;if(G.qi>=G.items.length)G.qi=0;paint()}
function start(){G.run=true;$('start-overlay').style.display='none';G.qi=0;G.lives=G.max;G.streak=0;G.s1=0;G.s2=0;G.items=shuffle(BANK);paint()}
function bootGame(items){
  BANK=items; G=new GameShell({items:BANK,timerSec:20});
  G.onTimeout=function(){G.bad();next()};
  $('btn-start').onclick=$('btn-start2').onclick=start;
  $('btn-reset').onclick=function(){G.reset()};
  $('btn-next').onclick=function(){if(G.run)next()};
  bootFx();G.hud();
  var n=$('start-overlay').querySelector('.start-card p');
  if(n) n.textContent='Should / Shouldn\'t zones · bank '+BANK.length+' (U1 / non-ExamC).';
}
loadFatBank('should.json', normalizeShould, bootGame);

</script>
