/* Aaron HARD RULE: no P6 GE 1st Term Exam 2026-2027 paper items */
function isExamPaperItem(it){
  if(!it || typeof it!=="object") return false;
  var s=String(it.source||""), u=String(it.unit||""), tag=String(it.tag||""), id=String(it.id||""), p=String(it.prompt||"");
  var origin=String(it.origin||""), section=String(it.section||"");
  var blob=(s+" "+u+" "+tag+" "+id+" "+p+" "+origin).toLowerCase();
  if(/^exam/i.test(s)) return true;
  if(/exam\s*[a-j]/i.test(blob)) return true;
  if(/\bexam[a-j]\b/i.test(blob)) return true;
  if(/u\d\s*\/\s*exam/i.test(u)) return true;
  if(/typhoon-parallel|examc-parallel|exam-parallel/i.test(tag+" "+origin)) return true;
  if(/\[exam\b/i.test(p) || /\[exam\b/i.test(id)) return true;
  if((section==="F"||section==="H") && (/exam/i.test(s+u) || /\[exam/i.test(p))) return true;
  return false;
}
function filterNoExamItems(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(function(it){ return !isExamPaperItem(it); });
}
function showExamQuarantine(msg){
  var banner=document.getElementById("exam-quarantine-banner");
  if(!banner){
    banner=document.createElement("div");
    banner.id="exam-quarantine-banner";
    banner.setAttribute("role","status");
    banner.style.cssText="position:sticky;top:0;z-index:9999;background:#7f1d1d;color:#fff;padding:12px 16px;font:600 15px/1.4 system-ui,sans-serif;text-align:center;border-bottom:3px solid #fbbf24;";
    document.body.insertBefore(banner, document.body.firstChild);
  }
  banner.textContent=msg;
  ["btn-start","btn-start2"].forEach(function(id){
    var b=document.getElementById(id);
    if(b){ b.disabled=true; b.style.opacity="0.45"; b.style.pointerEvents="none"; b.textContent="0 items — exam bank removed"; }
  });
  var n=document.querySelector("#start-overlay .start-card p");
  if(n) n.textContent=msg+" · 0 playable items.";
}

function parseBankPayload(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(data.items && Array.isArray(data.items)) return data.items;
  return [];
}
function loadFatBank(fileName, normalizeFn, onReady){
  function finish(raw){
    var payloadItems = filterNoExamItems(parseBankPayload(raw));
    var items = normalizeFn(payloadItems);
    if(!items.length){
      try{
        var emb = filterNoExamItems(parseBankPayload(JSON.parse($("bank-json").textContent)));
        items = normalizeFn(emb);
      }catch(e){ items=[]; }
    }
    onReady(shuffle(items));
  }
  var embedded = null;
  try{ embedded = JSON.parse($("bank-json").textContent); }catch(e){ embedded = {items:[]}; }
  var tryFetch = (location.protocol !== "file:");
  if(!tryFetch){ finish(embedded); return; }
  fetch("../../banks/"+fileName).then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
    .then(function(data){ finish(data); })
    .catch(function(){ finish(embedded); });
}

    if(isExamPaperItem(it)) return false;
    var blob=((it.prompt||"")+" "+(it.answer||"")+" "+(it.if_clause||"")+" "+(it.will_clause||"")).toLowerCase();
    return /flu|cough|fever|germ|sick|ill|hospital|doctor|medicine|pain|ache|infect|virus|cold|temperature|vomit|headache|tooth|gum|bandage|pill|wound|hydrate|sneeze|tissue|sore throat|stomachache|dizzy|health|rest|bed/.test(blob);
  }).map(function(it){
    var ans=it.answer||"";
    var ifc=it.if_clause||"";
    var willc=it.will_clause||"";
    var patient="Patient";
    var m=ans.match(/^If\s+(.+?)\s+(eats|shares|sleeps|drinks|brushes|does|do|is|are|takes|has|have|goes|stays|plays|forgets|keeps|wears|washes|covers|puts|runs|revises|leaves|listens|helps|practises)\b/i);
    if(m) patient=m[1];
    else { var m2=ans.match(/^If\s+([^,]+)/); if(m2){ var bits=m2[1].trim().split(/\s+/); patient=bits.slice(0, Math.min(3,bits.length)).join(" "); } }
    var if_part = ans.split(",")[0].trim();
    if(!if_part.startsWith("If")) if_part=ans ? ans.split(",")[0].trim() : ("If "+patient+" "+ifc);
    var will_part = (ans.split(",").slice(1).join(",")||willc).trim();
    var result = will_part.replace(/^(he|she|they|we|I|you)\s+will\s+/i,"").replace(/^will\s+/i,"");
    if(!result && willc) result=willc.replace(/^(he|she|they)\s+will\s+/i,"");
    return {id:it.id, if_part:if_part, will_part:will_part||("will "+result), patient:patient, result:result, source:it.source||"ws"};
  });
  var merged = fromBank.concat(EXTRA_ILLNESS);
  var seen={}; var out=[];
  merged.forEach(function(it){
    if(isExamPaperItem(it)) return;
    var key=(it.if_part||"").toLowerCase()+"|"+(it.result||"").toLowerCase();
    if(!it.if_part || !it.result || seen[key]) return; seen[key]=1; out.push(it);
  });
  return out;
}
function paint(){cur=G.items[G.qi%G.items.length];lock=false;holdP={};holdR={};
 $('prompt').textContent='Clinic: build the If…will… pair'; $('hint').textContent=cur.if_part+' …';
 var pats=shuffle([cur].concat(pickN(BANK.filter(function(x){return x.patient!==cur.patient}),3)));
 var ress=shuffle([cur].concat(pickN(BANK.filter(function(x){return x.result!==cur.result}),3)));
 function fill(id,list,kind){var g=$(id);g.innerHTML='';list.forEach(function(it){var b=document.createElement('button');b.type='button';b.className='choice';
  b.textContent=kind==='p'?it.if_part:('→ will '+it.result);
  b.addEventListener('pointerdown',function(e){e.preventDefault();if(lock||!G.run)return;try{b.setPointerCapture(e.pointerId)}catch(err){}b.classList.add('held');
   var side=id==='grid1'?1:2; if(kind==='p')holdP[e.pointerId]={it:it,el:b,side:side}; else holdR[e.pointerId]={it:it,el:b,side:side}; tryHeal();});
  b.addEventListener('pointerup',function(e){b.classList.remove('held');delete holdP[e.pointerId];delete holdR[e.pointerId]});g.appendChild(b)})}
 fill('grid1',pats,'p'); fill('grid2',ress,'r'); G.startTimer();
}
function tryHeal(){var a=Object.keys(holdP),b=Object.keys(holdR); if(!a.length||!b.length||lock)return;
 var P=holdP[a[0]],R=holdR[b[0]]; lock=true;G.stop();
 var ok=P.it.patient===cur.patient && R.it.result===cur.result;
 if(ok){P.el.classList.add('ok');R.el.classList.add('ok');G.ok(P.side); toast(cur.if_part+', '+cur.will_part)}
 else{P.el.classList.add('bad');R.el.classList.add('bad');G.bad()} setTimeout(next,800)}
function next(){if(G.lives<=0)return;G.qi++;if(G.qi>=G.items.length)G.qi=0;paint()}
function start(){G.run=true;$('start-overlay').style.display='none';G.qi=0;G.lives=G.max;G.streak=0;G.s1=0;G.s2=0;G.items=shuffle(BANK);paint()}
function bootGame(items){
  BANK=items; G=new GameShell({items:BANK,timerSec:20});
  G.onTimeout=function(){G.bad();next()};
  $('btn-start').onclick=$('btn-start2').onclick=start;
  $('btn-reset').onclick=function(){G.reset()};
  $('btn-next').onclick=function(){if(G.run)next()};
  bootFx();G.hud();
  var n=$('start-overlay').querySelector('.start-card p');
  if(n) n.textContent='Illness If…will clinic (worksheet/parallel only; ExamE removed) · bank '+BANK.length+'.';
}
loadFatBank('if-will.json', normalizeIllness, bootGame);
