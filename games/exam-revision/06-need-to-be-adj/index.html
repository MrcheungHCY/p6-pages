:"need to be","distractors":["need to","need be","needs"],"unit":"U3","skill":"need-to-be","difficulty":"easy","choices":["need to be","need to","need be","needs"],"source":"branch-gap","form":"gap","branch":"meta"},{"id":"need-49","prompt":"He ____ do more exercise.","answer":"need to","distractors":["need to be","need be","needs"],"unit":"U3","skill":"need-to-be","difficulty":"easy","choices":["need to","need to be","need be","needs"],"source":"branch-gap","form":"gap","branch":"meta"},{"id":"need-50","prompt":"Tim ____ give a speech tomorrow.","answer":"need to","distractors":["need to be","need be","needs"],"unit":"U3","skill":"need-to-be","difficulty":"easy","choices":["need to","need to be","need be","needs"],"source":"branch-gap","form":"gap","branch":"meta"},{"id":"need-51","prompt":"Before speaking, you ____ brave.","answer":"need to be","distractors":["need to","need be","needs"],"unit":"U3","skill":"need-to-be","difficulty":"easy","choices":["need to be","need to","need be","needs"],"source":"branch-gap","form":"gap","branch":"meta"},{"id":"need-52","prompt":"Cat owners ____ responsible.","answer":"need to be","distractors":["need to","need be","needs"],"unit":"U3","skill":"need-to-be","difficulty":"easy","choices":["need to be","need to","need be","needs"],"source":"branch-gap","form":"gap","branch":"meta"},{"id":"need-53","prompt":"You ____ feed your cat every day.","answer":"need to","distractors":["need to be","need be","needs"],"unit":"U3","skill":"need-to-be","difficulty":"easy","choices":["need to","need to be","need be","needs"],"source":"branch-gap","form":"gap","branch":"meta"}]}</script>
<script>

function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},1100)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var x=a[i];a[i]=a[j];a[j]=x}return a}
function pickN(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
function GameShell(o){
  var s=this;s.lives=o.lives||3;s.max=s.lives;s.streak=0;s.s1=0;s.s2=0;s.sec=o.timerSec||18;s.left=0;s.tid=null;s.run=false;s.qi=0;s.items=o.items||[];
  s.hud=function(){$('hud-timer').textContent='⏱ '+s.left+'s';$('hud-lives').textContent='♥ '+s.lives;$('hud-streak').textContent='🔥 '+s.streak;$('hud-p1').textContent='P1 '+s.s1;$('hud-p2').textContent='P2 '+s.s2;$('hud-q').textContent=(s.items.length?(s.qi+1):0)+'/'+s.items.length};
  s.startTimer=function(){clearInterval(s.tid);s.left=s.sec;s.hud();s.tid=setInterval(function(){s.left--;s.hud();if(s.left<=0){clearInterval(s.tid);if(s.onTimeout)s.onTimeout()}},1000)};
  s.stop=function(){clearInterval(s.tid)};
  s.ok=function(p){s.streak++;if(p===2)s.s2++;else s.s1++;s.hud();try{HcyFx.correct()}catch(e){}toast('Nice!');};
  s.bad=function(){s.streak=0;s.lives=Math.max(0,s.lives-1);s.hud();try{HcyFx.wrong()}catch(e){}toast(s.lives?'Oops':'Out of lives');};
  s.reset=function(){s.stop();s.lives=s.max;s.streak=0;s.s1=0;s.s2=0;s.qi=0;s.run=false;s.hud();try{HcyFx.reset()}catch(e){};$('start-overlay').style.display='flex'};
}
function bootFx(){try{HcyFx.init({mascotMount:$('hcy-mascot-slot'),mascotMode:'3d'})}catch(e){}
 document.body.addEventListener('pointerdown',function(){try{HcyFxAudio&&HcyFxAudio.unlock()}catch(e){}},{once:true});}

/* Aaron HARD RULE: no P6 GE 1st Term Exam 2026-2027 paper items */
function isExamPaperItem(it){
  if(!it || typeof it!=="object") return false;
  var s=String(it.source||""), u=String(it.unit||""), tag=String(it.tag||""), id=String(it.id||""), p=String(it.prompt||"");
  var origin=String(it.origin||""), section=String(it.section||"");
  var blob=(s+" "+u+" "+tag+" "+id+" "+p+" "+origin).toLowerCase();
  if(/^exam/i.test(s)) return true;
  if(/exam\s*[a-j]/i.test(blob)) return true;
  if(/\bexam[a-j]\b/i.test(blob)) return true;
  if(/u\d\s*\/\s*exam/i.test(u)) return true;
  if(/typhoon-parallel|examc-parallel|exam-parallel/i.test(tag+" "+origin)) return true;
  if(/\[exam\b/i.test(p) || /\[exam\b/i.test(id)) return true;
  if((section==="F"||section==="H") && (/exam/i.test(s+u) || /\[exam/i.test(p))) return true;
  return false;
}
function filterNoExamItems(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(function(it){ return !isExamPaperItem(it); });
}
function showExamQuarantine(msg){
  var banner=document.getElementById("exam-quarantine-banner");
  if(!banner){
    banner=document.createElement("div");
    banner.id="exam-quarantine-banner";
    banner.setAttribute("role","status");
    banner.style.cssText="position:sticky;top:0;z-index:9999;background:#7f1d1d;color:#fff;padding:12px 16px;font:600 15px/1.4 system-ui,sans-serif;text-align:center;border-bottom:3px solid #fbbf24;";
    document.body.insertBefore(banner, document.body.firstChild);
  }
  banner.textContent=msg;
  ["btn-start","btn-start2"].forEach(function(id){
    var b=document.getElementById(id);
    if(b){ b.disabled=true; b.style.opacity="0.45"; b.style.pointerEvents="none"; b.textContent="0 items — exam bank removed"; }
  });
  var n=document.querySelector("#start-overlay .start-card p");
  if(n) n.textContent=msg+" · 0 playable items.";
}

function parseBankPayload(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(data.items && Array.isArray(data.items)) return data.items;
  return [];
}
function loadFatBank(fileName, normalizeFn, onReady){
  function finish(raw){
    var payloadItems = filterNoExamItems(parseBankPayload(raw));
    var items = normalizeFn(payloadItems);
    if(!items.length){
      try{
        var emb = filterNoExamItems(parseBankPayload(JSON.parse($("bank-json").textContent)));
        items = normalizeFn(emb);
      }catch(e){ items=[]; }
    }
    onReady(shuffle(items));
  }
  var embedded = null;
  try{ embedded = JSON.parse($("bank-json").textContent); }catch(e){ embedded = {items:[]}; }
  var tryFetch = (location.protocol !== "file:");
  if(!tryFetch){ finish(embedded); return; }
  fetch("../../banks/"+fileName).then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
    .then(function(data){ finish(data); })
    .catch(function(){ finish(embedded); });
}



var BANK=[], G=null, cur=null, lock=false, holdLane=null, holdWord=null;
function normalizeNeed(raw){
  return raw.map(function(it){
    var branch=it.branch||'adj';
    var ans=it.answer||'';
    var word='';
    var lane=branch;
    if(branch==='adj'){
      var m=ans.match(/need to be\s+(.+)$/i); word=m?m[1].replace(/\.$/,''):ans.replace(/^need to be\s+/i,'');
      lane='adj';
    } else if(branch==='verb'){
      var m2=ans.match(/need to\s+(.+)$/i); word=m2?m2[1].replace(/\.$/,''):ans.replace(/^need to\s+/i,'');
      lane='verb';
    } else if(branch==='meta'){
      if(/^need to be$/i.test(ans.trim()) || /\bneed to be\b/i.test(ans) && !/^need to be\s+\w+/i.test(ans)){
        lane='adj'; word='be + adj';
        // try extract adj from prompt blank context
        var pm=(it.prompt||'').match(/____\s+(\w+)/); if(pm) word=pm[1];
        else {
          var choices=it.choices||[];
          // keep answer as meta marker — use distractor-free word from prompt
          var last=(it.prompt||'').trim().split(/\s+/).pop().replace(/[._]/g,'');
          if(last && last.toLowerCase()!=='____') word=last;
        }
      } else if(/^need to$/i.test(ans.trim())){
        lane='verb';
        var pm2=(it.prompt||'').match(/____\s+(\w+)/); word=pm2?pm2[1]:'verb';
        var rest=(it.prompt||'').replace(/^.*?____\s*/,'');
        if(rest) word=rest.split(/\s+/).slice(0,3).join(' ').replace(/\.$/,'');
      } else if(/^need to be\s+/i.test(ans)){
        lane='adj'; word=ans.replace(/^need to be\s+/i,'').replace(/\.$/,'');
      } else if(/^need to\s+/i.test(ans)){
        lane='verb'; word=ans.replace(/^need to\s+/i,'').replace(/\.$/,'');
      } else { lane='adj'; word=ans; }
    }
    return {id:it.id, cue:it.prompt||ans, lane:lane, word:word, answer:ans, branch:branch};
  }).filter(function(x){return x.word && x.lane});
}
function paint(){cur=G.items[G.qi%G.items.length];lock=false;holdLane=null;holdWord=null;
 $('prompt').textContent=cur.cue; $('hint').textContent='Hold lane ('+(cur.lane==='adj'?'need to be + adj':'need to + verb')+') + word';
 ['lane-adj','lane-verb'].forEach(function(id){var el=$(id); if(el) el.classList.remove('held','ok','bad')});
 var words=shuffle([cur.word].concat(pickN(BANK.map(function(x){return x.word}).filter(function(w,i,a){return a.indexOf(w)===i&&w!==cur.word}),5)));
 var g=$('grid1'); g.innerHTML='';
 words.forEach(function(w){var b=document.createElement('button');b.type='button';b.className='choice';b.textContent=w;
  b.addEventListener('pointerdown',function(e){e.preventDefault();if(lock||!G.run)return;try{b.setPointerCapture(e.pointerId)}catch(err){}b.classList.add('held');
   holdWord={w:w,el:b,side:e.clientX<window.innerWidth/2?1:2}; tryLock();});
  b.addEventListener('pointerup',function(){b.classList.remove('held');holdWord=null}); g.appendChild(b)});
 G.startTimer();
}
[['lane-adj','adj'],['lane-verb','verb']].forEach(function(pair){
 var el=$(pair[0]); if(!el) return;
 el.addEventListener('pointerdown',function(e){e.preventDefault();if(lock||!G.run)return;try{this.setPointerCapture(e.pointerId)}catch(err){}this.classList.add('held');holdLane={lane:pair[1],el:this};tryLock()});
 el.addEventListener('pointerup',function(){this.classList.remove('held');holdLane=null});
});
function tryLock(){if(!holdLane||!holdWord||lock)return; lock=true;G.stop();
 var ok=holdLane.lane===cur.lane && holdWord.w===cur.word;
 if(ok){holdLane.el.classList.add('ok');holdWord.el.classList.add('ok');G.ok(holdWord.side); toast(cur.answer)}
 else{holdLane.el.classList.add('bad');holdWord.el.classList.add('bad');G.bad()} setTimeout(next,750)}
function next(){if(G.lives<=0)return;G.qi++;if(G.qi>=G.items.length)G.qi=0;paint()}
function start(){G.run=true;$('start-overlay').style.display='none';G.qi=0;G.lives=G.max;G.streak=0;G.s1=0;G.s2=0;G.items=shuffle(BANK);paint()}
function bootGame(items){
  BANK=items; G=new GameShell({items:BANK,timerSec:18});
  G.onTimeout=function(){G.bad();next()};
  $('btn-start').onclick=$('btn-start2').onclick=start;
  $('btn-reset').onclick=function(){G.reset()};
  $('btn-next').onclick=function(){if(G.run)next()};
  bootFx();G.hud();
  var n=$('start-overlay').querySelector('.start-card p');
  if(n) n.textContent='Need-to-be adj vs verb · bank '+BANK.length+'.';
}
loadFatBank('need-to-be.json', normalizeNeed, bootGame);

</script>
